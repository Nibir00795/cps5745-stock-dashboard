name: Update stock data

on:
  schedule:
    # 22:30 UTC, Monday to Friday: after the 16:00 New York close in both EST and EDT
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance==1.7.0 pandas
      - run: python scripts/fetch_prices.py
      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Update prices to $(tail -n 1 data/prices.csv | cut -d, -f1)"
            git push
          fi
